[project]
name = "openrouter-voice"
version = "1.0.0"
description = "Home Assistant integration for OpenRouter TTS + STT"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
